name: Compile 26.1.2

# Compile-only feedback loop for the 26.1.2 port. The full build (gametests,
# production smoke runs) lives in gametests.yml and only runs once this is green.
on:
  push:
    branches:
      - 'port/26.1.2'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-261-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile all modules
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :sable:compileJava \
            :simulated:compileJava \
            :offroad:compileJava \
            :aeronautics:compileJava \
            --continue --stacktrace --no-daemon 2>&1 | tee compile.log

      - name: Summarise errors
        if: always()
        shell: bash
        run: |
          {
            echo "## Compile result"
            echo
            if grep -qE '^BUILD SUCCESSFUL' compile.log; then
              echo "BUILD SUCCESSFUL"
            else
              echo "Compilation still failing. Top error sources:"
              echo
              echo '```'
              grep -oE '[^ /]+\.java:[0-9]+: error:' compile.log | sort | uniq -c | sort -rn | head -60 || true
              echo '```'
              echo
              echo "Total error lines: $(grep -cE 'error:' compile.log || true)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            compile.log
            build/reports/**
            */build/reports/**
          if-no-files-found: warn
