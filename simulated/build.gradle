plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/fabric-module.gradle')

loom {
    runs {
        datagen {
            inherit server
            name = 'Simulated Fabric Data Generation'
            runDir = 'runs/datagen'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg '-Dfabric-api.datagen.modid=simulated'
        }
    }
}

// The former `unpackPortingLibCompat` task rewrote Porting-Lib's shipped bytecode
// so that its `ConfiguredModel` generator matched the mappings this project used.
// Porting-Lib has no 26.1 build at all, so the task is gone; its datagen helpers
// have to be replaced or vendored instead.

dependencies {
    implementation project(':sable')
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
