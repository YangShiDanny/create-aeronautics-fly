# Dependencies
forgeconfigapiport_version=26.1.5
puzzleslib_version=26.1.15

create_fly_version=26.1.2-6.0.9-4

# Removed for 26.1 - no upstream builds exist for this version yet.
#   veil_version            : maven.blamejared.com tops out at veil-fabric-1.21.1.
#                             Most of the used API is vendored under
#                             simulated/src/main/java/foundry/veil - only the
#                             render-side classes (~23 imports) are unaccounted for.
#   sable_companion_version : maven.ryanhcode.dev only publishes the 1.21.1 artifacts.
#   energy_version          : team.reborn.energy.api.EnergyStorage is imported twice
#                             in simulated and has no 26.1 build; it needs vendoring.
#   porting_lib_version     : io.github.fabricators_of_create is imported 55 times
#                             (mostly DeferredHolder and the datagen model generators)
#                             and has no 26.1 build; needs vendoring/replacement.

